<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Simulasi Biologi Interaktif untuk OSN Biologi — Logolymp Edu</title>
<meta name="description" content="Simulasi Biologi Interaktif untuk OSN Biologi. Interactive biology simulations for the Indonesian Biology Olympiad (OSN), by Logolymp Edu.">
<style>
  :root{
    --bg:#f7f6f2; --card:#ffffff; --ink:#1d2321; --muted:#5f6b66; --line:#e3e1da;
    --accent:#1f7a5a; --accent-soft:#e3f1eb; --warm:#b8562e; --warm-soft:#f6e7df;
    --blue:#2f5f9e; --blue-soft:#e4ecf6;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141816; --card:#1c211f; --ink:#ecefed; --muted:#9aa6a0; --line:#2c3330;
      --accent:#4fbf93; --accent-soft:#1f3a30; --warm:#e08a63; --warm-soft:#3a281f;
      --blue:#7aa6e0; --blue-soft:#1f2b3b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
  a{color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}

  header{padding:56px 0 30px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:34px}
  .mark{font-weight:700;letter-spacing:.02em;font-size:15px}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
  .lang button{border:0;background:none;color:var(--muted);padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
  .lang button.on{background:var(--ink);color:var(--bg)}
  h1{font-size:clamp(30px,5vw,46px);line-height:1.12;margin:0 0 22px;letter-spacing:-.02em;max-width:18ch}
  .links{display:flex;flex-wrap:wrap;gap:10px}
  .pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;
    border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px}
  .pill:hover{border-color:var(--ink)}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
  .filters button{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px}
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:10px 0 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px -14px rgba(0,0,0,.25)}
  .thumb{aspect-ratio:16/9;display:grid;place-items:center;border-bottom:1px solid var(--line);overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb svg{width:44%;height:auto}
  .body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .tag.tool{background:var(--blue-soft);color:var(--blue)}
  .tag.wip{background:var(--warm-soft);color:var(--warm)}
  h3{margin:0;font-size:19px;letter-spacing:-.01em}
  .desc{margin:0;color:var(--muted);font-size:15px;flex:1}
  .tech{font-size:12.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .actions{display:flex;gap:8px;margin-top:4px}
  .btn{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:600;padding:9px 10px;border-radius:9px}
  .btn.primary{background:var(--ink);color:var(--bg)}
  .btn.off{opacity:.45;pointer-events:none}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="mark">Logolymp Edu</div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="id" class="on">ID</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
    <h1 data-i18n="title"></h1>
    <div class="links">
      <a class="pill" href="https://instagram.com/logolymp_edu" target="_blank" rel="noopener noreferrer">Instagram @logolymp_edu ↗</a>
      <a class="pill" href="https://wa.me/6285975120427" target="_blank" rel="noopener noreferrer">WhatsApp +62 859-7512-0427 ↗</a>
    </div>
  </header>

  <main class="grid" id="grid"></main>

</div>

<script>
/* =========================================================
   EDIT DI SINI — tambah proyek baru cukup salin satu blok {...}
   - demo:   link live (GitHub Pages). Kosongkan "" kalau tidak ada.
   - image:  opsional, mis. "img/hardy-weinberg.png" (taruh di repo ini).
   - category: "sim" (simulasi biologi) atau "tool" (alat/software; label biru)
   ========================================================= */
const USER = "GregTendi";
const PROJECTS = [
  {
    category: "sim",
    title: { id: "Simulasi Potensial Air", en: "Water Potential Simulator" },
    desc: {
      id: "Lihat bagaimana sel tumbuhan dan hewan merespons larutan di sekitarnya. Atur konsentrasi zat terlarut, jenis larutan, dan tekanan luar; amati Ψ = Ψs + Ψp berubah secara langsung.",
      en: "See how plant and animal cells respond to their surroundings. Adjust solute concentration, solution type and external pressure, and watch Ψ = Ψs + Ψp change live."
    },
    tech: "HTML · JavaScript · Canvas",
    demo: `https://${USER.toLowerCase()}.github.io/water-potential-sim/`,
    icon: "cell"
  },
  {
    category: "sim",
    title: { id: "Simulasi Hardy-Weinberg", en: "Hardy-Weinberg Simulator" },
    desc: {
      id: "Eksplorasi genetika populasi: frekuensi alel dan genotipe dari generasi ke generasi, serta apa yang terjadi saat asumsi kesetimbangan Hardy-Weinberg dilanggar.",
      en: "Explore population genetics: allele and genotype frequencies across generations, and what happens when Hardy-Weinberg equilibrium assumptions break."
    },
    tech: "HTML · JavaScript",
    demo: `https://${USER.toLowerCase()}.github.io/hardy-weinberg/`,
    icon: "dna"
  },
  {
    category: "sim",
    title: { id: "Simulator PCR", en: "PCR Simulator" },
    desc: {
      id: "Jalankan PCR dari awal sampai akhir: rancang primer, hitung volume bahan reaksi, atur program thermocycler, lalu baca hasilnya pada elektroforesis gel agarosa.",
      en: "Run a PCR from start to finish: design primers, calculate reagent volumes, program the thermocycler, then read the result on an agarose gel."
    },
    tech: "HTML · JavaScript",
    demo: `https://${USER.toLowerCase()}.github.io/pcr-simulator/`,
    icon: "pcr"
  },
  {
    category: "sim",
    title: { id: "Penyimpangan Semu Hukum Mendel", en: "Modified Mendelian Ratios" },
    desc: {
      id: "Pahami asal rasio epistasis, atavisme, komplementer, polimeri, dan alel ganda dari cara kerja produk gen dalam jalur biokimia, lengkap dengan papan Punnett dan editor jalur.",
      en: "See where epistasis, atavism, complementary, polymeric and multiple-allele ratios come from, based on how gene products act in a pathway, with Punnett squares and a pathway editor."
    },
    tech: "HTML · JavaScript",
    demo: `https://${USER.toLowerCase()}.github.io/mendel-extension/`,
    icon: "punnett"
  }
];

/* ---------- teks antarmuka ---------- */
const UI = {
  id: {
    title: "Simulasi Biologi Interaktif untuk OSN Biologi",
    all: "Semua", sim: "Simulasi Biologi", tool: "Alat & Software",
    tagSim: "Simulasi", tagTool: "Alat", wip: "Dalam pengembangan",
    demo: "Coba langsung", noDemo: "Tidak ada demo"
  },
  en: {
    title: "Interactive Biology Simulations for the Biology Olympiad (OSN)",
    all: "All", sim: "Biology Simulations", tool: "Tools & Software",
    tagSim: "Simulation", tagTool: "Tool", wip: "In progress",
    demo: "Try it live", noDemo: "No live demo"
  }
};

/* ---------- ikon placeholder (dipakai kalau tidak ada image) ---------- */
const ICONS = {
  pcr: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><path d="M30 10h20v8l-4 6v46a6 6 0 0 1-12 0V24l-4-6z"/><path d="M34 46h12"/><rect x="60" y="14" width="30" height="74" rx="4"/><path d="M66 30h18M66 44h18M68 58h14M66 72h18" stroke-width="4"/></svg>`,
  punnett: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><rect x="20" y="20" width="70" height="70" rx="6"/><path d="M43 20v70M67 20v70M20 43h70M20 67h70"/><path d="M8 32h6M8 55h6M8 78h6M32 8v6M55 8v6M78 8v6"/><circle cx="31" cy="31" r="5"/><circle cx="55" cy="55" r="5"/><circle cx="79" cy="79" r="5"/></svg>`,
  cell: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><rect x="14" y="20" width="72" height="60" rx="14"/><rect x="24" y="30" width="52" height="40" rx="10" stroke-dasharray="4 4"/><circle cx="58" cy="50" r="9"/><path d="M4 50h8M88 50h8M50 6v10M50 84v10"/></svg>`,
  dna: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><path d="M30 8c0 28 40 28 40 56s-40 28-40 28"/><path d="M70 8c0 28-40 28-40 56s40 28 40 28"/><path d="M36 22h28M38 36h24M38 64h24M36 78h28"/></svg>`,
  seq: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><path d="M10 30h50M30 50h55M18 70h48"/><path d="M8 88c8-20 12-20 16 0s8-30 14 0 10-14 14 0 8-24 14 0 10-10 14 0"/></svg>`,
  chart: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><path d="M10 88h82M10 88V10"/><path d="M18 70l18-16 14 10 20-28 16 10"/><path d="M28 40v20M48 30v26M68 22v20"/></svg>`
};
const TINTS = { sim:["var(--accent-soft)","var(--accent)"], tool:["var(--blue-soft)","var(--blue)"] };

/* ---------- render ---------- */
let lang = (() => { try { const v = localStorage.getItem("lang"); return UI[v] ? v : "id"; } catch(e){ return "id"; } })();

/* escape teks & hanya izinkan link https:// atau path relatif */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => (typeof u === "string" && (/^https:\/\//i.test(u) || /^[\w.\/-]+$/.test(u))) ? esc(u) : "";
let filter = "all";

function render(){
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));

  document.getElementById("grid").innerHTML = PROJECTS
    .filter(p => filter === "all" || p.category === filter)
    .map(p => {
      const [bg, fg] = TINTS[p.category] || TINTS.sim;
      const demo = safeUrl(p.demo), img = safeUrl(p.image);
      const thumb = img
        ? `<img src="${img}" alt="" loading="lazy">`
        : `<div style="color:${fg}">${ICONS[p.icon]||""}</div>`;
      return `
      <article class="card">
        <div class="thumb" style="background:${bg}">${thumb}</div>
        <div class="body">
          <div class="tags">
            <span class="tag ${p.category==="tool"?"tool":""}">${p.category==="sim"?t.tagSim:t.tagTool}</span>
            ${p.wip ? `<span class="tag wip">${t.wip}</span>` : ""}
          </div>
          <h3>${esc(p.title[lang])}</h3>
          <p class="desc">${esc(p.desc[lang])}</p>
          <div class="tech">${esc(p.tech)}</div>
          <div class="actions">
            <a class="btn primary ${demo?"":"off"}" href="${demo||"#"}" target="_blank" rel="noopener noreferrer">${demo?esc(t.demo)+" →":esc(t.noDemo)}</a>
          </div>
        </div>
      </article>`;
    }).join("");
}

document.addEventListener("click", e => {
  const l = e.target.closest("[data-lang]");
  if (l && UI[l.dataset.lang]){ lang = l.dataset.lang; try{ localStorage.setItem("lang", lang); }catch(_){} render(); }
});
render();
</script>
</body>
</html>
