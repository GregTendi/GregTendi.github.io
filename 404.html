<title>Pindah ke simulasi.logolymp.com — Logolymp Edu</title>
<link rel="canonical" href="https://simulasi.logolymp.com/">
<meta http-equiv="refresh" content="0; url=https://simulasi.logolymp.com/">
<script>
  // Simulasi Logolymp Edu sudah pindah ke simulasi.logolymp.com.
  // Alamat lama gregtendi.github.io/<simulasi>/ diarahkan ke halaman yang sama di alamat baru.
  (function () {
    var SIMS = ["water-potential-sim", "hardy-weinberg", "pcr-simulator", "mendel-extension", "linkage", "population-growth"];
    var first = location.pathname.split("/")[1] || "";
    var target = "https://simulasi.logolymp.com/" + (SIMS.indexOf(first) >= 0 ? first + "/" + location.hash : "");
    location.replace(target);
  })();
</script>
